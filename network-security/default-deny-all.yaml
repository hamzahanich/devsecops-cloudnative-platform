# ==============================================================================
# Politique Réseau Zero-Trust par défaut : Interdiction totale Ingress & Egress
# Appliquée à tout pod du namespace sans autorisation explicite
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: secured-apps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
