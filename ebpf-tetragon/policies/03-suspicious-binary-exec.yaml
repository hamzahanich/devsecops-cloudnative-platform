apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: detect-suspicious-binary-exec
  annotations:
    description: "Interception eBPF des outils offensifs (nmap, netcat, socat, tcpdump) et reverse shells"
spec:
  kprobes:
    - call: "sys_enter_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Postfix"
              values:
                - "/nmap"
                - "/nc"
                - "/netcat"
                - "/socat"
                - "/tcpdump"
                - "/wireshark"
                - "/tshark"
          matchActions:
            - action: Sigkill
            - action: Post
