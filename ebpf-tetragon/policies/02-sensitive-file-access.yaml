apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: detect-sensitive-file-access
  annotations:
    description: "Surveillance eBPF en temps réel de l'accès aux fichiers critiques (/etc/shadow, /etc/passwd, secrets K8s)"
spec:
  kprobes:
    - call: "security_file_open"
      syscall: false
      args:
        - index: 0
          type: "file"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/etc/shadow"
                - "/etc/sudoers"
                - "/root/.ssh"
                - "/var/run/secrets/kubernetes.io/serviceaccount/token"
          matchActions:
            - action: Post
